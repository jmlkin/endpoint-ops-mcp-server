[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endpoint-ops-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol server that lets you talk to a studio endpoint fleet from Claude — Tools, Resources, and Prompts over 100% synthetic data. No API key required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jose Milan" }]
keywords = [
    "model-context-protocol", "mcp", "anthropic", "claude", "claude-desktop",
    "endpoint-management", "fleet", "compliance", "devops", "sre",
]
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
endpoint-ops-mcp = "endpoint_ops_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jmlkin/endpoint-ops-mcp-server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
